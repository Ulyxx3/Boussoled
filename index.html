<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boussole Éthérée</title>
    
    <!-- Typographie moderne Space Grotesk pour un rendu minimaliste et futuriste -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Feuille de style principale -->
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

    <!-- Canvas 2D plein écran pour la nébuleuse 3D de particules -->
    <canvas id="nebula-canvas" aria-hidden="true"></canvas>

    <!-- Vignette radiale sombre pour donner une impression de profondeur spatiale -->
    <div class="nebula-vignette" aria-hidden="true"></div>

    <!-- Signature en bas à gauche cliquable avec liens GitHub -->
    <div class="nebula-info" aria-label="Crédits et liens GitHub">
        <a href="https://github.com/lilouhldmnn" target="_blank" rel="noopener noreferrer" class="info-title" title="Profil GitHub de lilouhldmnn">ETHER</a>
        <a href="https://github.com/Ulyxx3" target="_blank" rel="noopener noreferrer" class="info-author" title="Profil GitHub de Ulyxx3">ULYXX3</a>
    </div>

    <!-- Cercle de la boussole fixé au centre exact de l'écran -->
    <div class="compass" id="compassContainer" role="region" aria-label="Boussole d'orientation">
        
        <!-- Cadran STRICTEMENT FIXE avec les 4 points cardinaux (N, E, S, W) -->
        <div class="compass-dial static-dial" id="compassDial" aria-hidden="true">
            <!-- Repère Nord (0° / Haut) -->
            <div class="cardinal cardinal-north">
                <span class="cardinal-indicator"></span>
                <span class="cardinal-label">N</span>
            </div>
            
            <!-- Repère Est (90° / Droite) -->
            <div class="cardinal cardinal-east">
                <span class="cardinal-label">E</span>
                <span class="cardinal-indicator"></span>
            </div>

            <!-- Repère Sud (180° / Bas) -->
            <div class="cardinal cardinal-south">
                <span class="cardinal-label">S</span>
                <span class="cardinal-indicator"></span>
            </div>

            <!-- Repère Ouest (270° / Gauche) -->
            <div class="cardinal cardinal-west">
                <span class="cardinal-indicator"></span>
                <span class="cardinal-label">W</span>
            </div>
        </div>

        <!-- Anneau géométrique statique avec lueur dynamique -->
        <div class="compass-circle"></div>

        <!-- Coeur de la boussole : affichage minimaliste du nombre de mètres jusqu'à la cible -->
        <div class="compass-core">
            <div id="distance" title="Distance jusqu'à la cible">
                <span id="distance-val">--</span><span class="unit">m</span>
            </div>
            
            <!-- Bouton de bascule de mode -->
            <button id="enableCompass" class="btn-activate">Pointer vers la cible</button>
            
            <!-- Statut discret -->
            <div id="gps-status" class="gps-status">Mode Veille</div>
        </div>

        <!-- Flèche géométrique invisible servant d'axe de repère -->
        <div class="arrow" aria-hidden="true"></div>
    </div>

    <!-- Slider de couleur situé en bas de la boussole -->
    <div class="slider-container" aria-label="Réglage de la couleur">
        <div class="slider-label">COULEUR</div>
        <div class="slider-track-wrap">
            <input 
                type="range" 
                id="colorSlider" 
                min="0" 
                max="360" 
                value="5" 
                step="1"
                aria-label="Changer la couleur de la nébuleuse et de la boussole"
            >
        </div>
    </div>

    <!-- Scripts de l'application -->
    <script src="dual.js?v=8"></script>
    <script src="nebula.js?v=8"></script>

</body>
</html>
